# ─────────────────────────────────────────────────────────────
# 채용공고 수집 설정  —  Java/Spring 백엔드 / 신입 + 1~3년차 / 수도권
# 이 파일만 고치면 수집 조건이 바뀝니다. 코드는 건드릴 필요 없습니다.
# 고친 뒤:  python -m src.main --dry-run --from-cache   (재크롤링 없이 즉시 확인)
# ─────────────────────────────────────────────────────────────

경력:
  # 두 트랙을 따로 관리합니다. 노션 '구분' 칼럼에 이 이름이 그대로 들어가므로
  # 노션에서 트랙별로 필터링·정렬할 수 있습니다.
  # 한쪽만 보고 싶으면 '사용: false' 로 끄세요.
  트랙:
    신입:
      사용: true
      최소_연차: 0
      최대_연차: 0
    1~3년차:
      사용: true
      최소_연차: 1
      최대_연차: 3

  # 공고가 '신입 지원 가능'으로 표시돼 있으면 연차 계산과 무관하게 신입 트랙에 넣는다
  신입_공고_항상포함: true

지역:
  허용: [서울, 경기, 인천]
  재택_우대: true      # 재택/원격 언급 시 가산점

키워드:
  # 사람인 검색어로 쓰입니다 (원티드는 직무 카테고리로 거릅니다)
  검색어: [백엔드, Java, Spring, 서버개발, 백엔드 개발자]

  # 가산점. 제목·본문·기술스택에서 찾습니다.
  #   점수 — 높을수록 상위 노출
  #   별칭 — 실제 공고에 쓰이는 표기들. 하나라도 걸리면 매칭됩니다.
  # ※ 영문 별칭은 단어 단위로 매칭합니다 (java 가 javascript 에 걸리지 않음)
  우대_스택:
    Java:
      점수: 6
      별칭: [java, 자바]
    Spring:
      점수: 5
      별칭: [spring, 스프링]
    Spring Boot:
      점수: 5
      별칭: [spring boot, springboot, 스프링부트, 스프링 부트]
    Spring Data JPA:
      점수: 4
      별칭: [spring data jpa, jpa, hibernate, 하이버네이트]
    Docker:
      점수: 3
      별칭: [docker, 도커, 컨테이너]
    AWS:
      점수: 3
      별칭: [aws, amazon web services, ec2, s3, rds]
    Grafana:
      점수: 2
      별칭: [grafana, 그라파나, prometheus, 프로메테우스]
    Jira:
      점수: 1
      별칭: [jira, 지라, atlassian]
    Slack:
      점수: 1
      별칭: [slack, 슬랙]

    # 있으면 좋은 주변 스택 (점수는 낮게)
    MySQL:
      점수: 1
      별칭: [mysql, mariadb]
    Redis:
      점수: 1
      별칭: [redis, 레디스]
    Kafka:
      점수: 1
      별칭: [kafka, 카프카]
    Kubernetes:
      점수: 1
      별칭: [kubernetes, k8s, 쿠버네티스]
    MSA:
      점수: 1
      별칭: [msa, 마이크로서비스, microservice]

  # 제목/본문에 하나라도 걸리면 아예 제외
  # ※ 너무 세면 좋은 공고도 같이 날아갑니다. 결과 보면서 줄이거나 늘리세요.
  제외:
    - 파견
    - 도급
    - 아웃소싱
    - 프리랜서
    - 계약직
    - "[인턴]"         # 인턴 공고. 채용연계형도 보고 싶으면 이 줄을 지우세요
    - 산업기능요원
    - 보충역
    - 병역특례
    - 팀장급
    - 시니어 개발자
    - CTO

원티드:
  # 872 서버/백엔드(580건) · 900 Java 개발자(+221건) · 660 웹 개발자(+157건)
  # 괄호는 수도권 기준 실측치. 899 Node.js / 895 Python / 10110 DevOps 도 있지만
  # Java/Spring 지향이라 제외했습니다. 필요하면 번호만 추가하세요.
  직무_카테고리: [872, 900, 660]
  직군_그룹: 518         # 518 = 개발
  지역코드: [seoul.all, gyeonggi.all, incheon.all]
  상세조회: true         # 마감일·요구사항까지 가져옵니다 (느려짐)
  최대_수집건수: 1200

사람인:
  # 사람인 지역코드: 101=서울 102=경기 108=인천
  # ↑ 발급받은 키의 문서에서 한 번 확인해 주세요. 다르면 이 숫자만 고치면 됩니다.
  지역코드: [101, 102, 108]
  직무코드: [2]          # 2 = IT개발·데이터
  페이지당: 110
  최대_페이지: 5

출력:
  최소_적합도점수: 5     # 이 점수 미만은 노션에 올리지 않음 (Java 하나면 6점)
